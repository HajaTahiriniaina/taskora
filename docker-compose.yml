name: taskora

# Profils :
#   (aucun)    stack actuelle : database, api (Symfony), converter, web (nginx)
#   identity   + db-init (droits MariaDB) + identity (identity-service Spring Boot)
#   board      + db-init (schéma et compte board) + board (board-service Spring Boot, phase 3)
#   quality    + sonarqube (http://localhost:9000, pour BackReviewer)
# Ports de développement d'identity (8082) : -f docker-compose.identity-dev.yml
# Port de développement de board-service (8083) : -f docker-compose.board-dev.yml
# Secrets internes (U12, un par appelant, tous distincts) : INTERNAL_API_SECRET (identity → Symfony),
# INTERNAL_SECRET_IDENTITY_TO_BOARD (identity → board), INTERNAL_SECRET_BOARD_TO_SYMFONY (board → Symfony).

services:
  database:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-taskora}
      MARIADB_USER: ${DB_USER:-taskora}
      MARIADB_PASSWORD: ${DB_PASSWORD:-taskora}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-taskora_root}
      # Lu par l'init root (schéma et compte identity), jamais affiché.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_change_me}
      # Schéma et compte board (board-migration.md §3) ; vide = non créés.
      BOARD_DB_PASSWORD: ${BOARD_DB_PASSWORD:-}
      BOARD_GRANT_COMMENT_FILES: ${BOARD_GRANT_COMMENT_FILES:-off}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
      # Volume vide : exécuté automatiquement. Volume existant :
      #   docker compose exec database /docker-entrypoint-initdb.d/10-taskora-init.sh
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3307}:3306"
    networks: [default, backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    # Symfony configuration (S3 storage, secrets…) comes from backend/.env.
    # Optional: without it, the image falls back to backend/.env.dist defaults.
    env_file:
      - path: ./backend/.env
        required: false
    # Docker-specific values, they override backend/.env:
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change_me_in_production_please}
      DATABASE_URL: mysql://${DB_USER:-taskora}:${DB_PASSWORD:-taskora}@database:3306/${DB_NAME:-taskora}?serverVersion=11.8.2-MariaDB&charset=utf8mb4
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-taskora_jwt_passphrase_change_me}
      # Secret de POST /internal/invitations/claim, appelant identity (ADR A10). Vide = endpoint refusé.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Secret des endpoints internes appelés par board-service (U12 : /internal/notifications…).
      INTERNAL_SECRET_BOARD_TO_SYMFONY: ${INTERNAL_SECRET_BOARD_TO_SYMFONY:-}
      SERVER_NAME: ":80"
    volumes:
      - jwt_keys:/app/config/jwt
      - uploads:/app/public/uploads
    # API_BIND=127.0.0.1 par défaut : /internal/* n'est pas joignable depuis le réseau. Ne l'ouvrir qu'en connaissance de cause.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8081}:80"
    networks: [default, backend, converter]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Office / LibreOffice documents → PDF for the in-page viewer (Gotenberg = LibreOffice over HTTP).
  # Only reachable by the API, on an internal network: no Internet access, no access to the database.
  converter:
    image: gotenberg/gotenberg:8@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=240s", "--libreoffice-restart-after=20", "--log-level=warn"]
    networks: [converter]

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Amont de /api/auth/ et /api/me : api:80 (Symfony) tant que la bascule n'est pas faite,
      # identity:8080 après. Changer la valeur puis « docker compose up -d web » (sans --build).
      IDENTITY_UPSTREAM: ${IDENTITY_UPSTREAM:-api:80}
      # on = gel des écritures d'identité (503 sur POST /api/auth/register et PATCH /api/me).
      IDENTITY_WRITE_FREEZE: ${IDENTITY_WRITE_FREEZE:-off}
      # Amonts des tranches de board-service (board-migration.md §5.2) : api:80 (Symfony) ou
      # board:8080 après la bascule de la tranche. Même commutation : « docker compose up -d web ».
      BOARD_T1_UPSTREAM: ${BOARD_T1_UPSTREAM:-api:80}
      BOARD_T2_UPSTREAM: ${BOARD_T2_UPSTREAM:-api:80}
      BOARD_T3_UPSTREAM: ${BOARD_T3_UPSTREAM:-api:80}
      BOARD_T4_UPSTREAM: ${BOARD_T4_UPSTREAM:-api:80}
      BOARD_T5_UPSTREAM: ${BOARD_T5_UPSTREAM:-api:80}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    networks: [default, backend]

  # ---------------------------------------------------------------- profils identity et board
  # Init root idempotente sur un volume existant, après les migrations Symfony
  # (les droits sur les tables de taskora exigent qu'elles existent).
  db-init:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    profiles: [identity, board]
    restart: "no"
    user: "999:999"
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["/docker-entrypoint-initdb.d/10-taskora-init.sh"]
    environment:
      DB_HOST: database
      MARIADB_DATABASE: ${DB_NAME:-taskora}
      MARIADB_USER: ${DB_USER:-taskora}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-taskora_root}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_change_me}
      BOARD_DB_PASSWORD: ${BOARD_DB_PASSWORD:-}
      BOARD_GRANT_COMMENT_FILES: ${BOARD_GRANT_COMMENT_FILES:-off}
    volumes:
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    networks: [backend]

  identity:
    build:
      context: ./services
      dockerfile: identity-service/Dockerfile
    profiles: [identity]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # m10 : JVM à 75 % de mem_limit (JAVA_TOOL_OPTIONS de l'image).
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      database:
        condition: service_healthy
      # Les clés JWT sont créées par l'entrypoint d'api (volume jwt_keys).
      api:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      IDENTITY_DB_URL: jdbc:mariadb://database:3306/identity
      IDENTITY_DB_USER: identity
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_change_me}
      JWT_PRIVATE_KEY_PATH: /run/taskora/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/taskora/jwt/public.pem
      # Même variable que le service api (même paire de clés Lexik).
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-taskora_jwt_passphrase_change_me}
      LEGACY_SCHEMA: ${DB_NAME:-taskora}
      LEGACY_ZONE: Europe/Paris
      SYMFONY_INTERNAL_URL: http://api:80
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Consommation des invitations (U12, board-migration.md §5.3) : URL et secret commutés ENSEMBLE.
      # Avant la bascule de T1 : Symfony + INTERNAL_API_SECRET. Après : http://board:8080 +
      # la valeur de INTERNAL_SECRET_IDENTITY_TO_BOARD. Puis « docker compose up -d identity ».
      INVITATION_CLAIM_URL: ${INVITATION_CLAIM_URL:-http://api:80}
      INVITATION_CLAIM_SECRET: ${INVITATION_CLAIM_SECRET:-${INTERNAL_API_SECRET:-}}
    volumes:
      - jwt_keys:/run/taskora/jwt:ro
    # Réseau interne uniquement (pas d'accès Internet, port non publié) : nginx (web) y accède.
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8091 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------- profil board (phase 3)
  # Image construite par BackCodeur (services/board-service/Dockerfile) : le profil reste inactif
  # tant qu'elle n'existe pas. DML seulement sur taskora (board-migration.md §3), Flyway sur `board`.
  board:
    build:
      context: ./services
      dockerfile: board-service/Dockerfile
    profiles: [board]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # JVM à 75 % de mem_limit (-XX:MaxRAMPercentage=75 dans l'image).
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      database:
        condition: service_healthy
      # Clés JWT (créées par l'entrypoint d'api) et migrations Doctrine passées.
      api:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      BOARD_DB_URL: jdbc:mariadb://database:3306/${DB_NAME:-taskora}
      BOARD_DB_USER: board
      BOARD_DB_PASSWORD: ${BOARD_DB_PASSWORD:-}
      # Clé PUBLIQUE seulement : ni JWT_PASSPHRASE ni JWT_PRIVATE_KEY_PATH (B-ADR-2).
      JWT_PUBLIC_KEY_PATH: /run/taskora/jwt/public.pem
      SYMFONY_INTERNAL_URL: http://api:80
      # U12 : jamais INTERNAL_API_SECRET ici. Vides ou égaux = refus de démarrer.
      INTERNAL_SECRET_IDENTITY_TO_BOARD: ${INTERNAL_SECRET_IDENTITY_TO_BOARD:-}
      INTERNAL_SECRET_BOARD_TO_SYMFONY: ${INTERNAL_SECRET_BOARD_TO_SYMFONY:-}
      LEGACY_ZONE: Europe/Paris
      # on = en-tête X-Taskora-Backend: board (tests de routage, CI et recette ; off en exploitation).
      BOARD_ROUTING_MARKER: ${BOARD_ROUTING_MARKER:-off}
      # Purge de la corbeille : Symfony jusqu'à T5.
      BOARD_PURGE_ENABLED: "off"
    volumes:
      # Seul public.pem est lu.
      - jwt_keys:/run/taskora/jwt:ro
    # Réseau interne uniquement ; port publié seulement par docker-compose.board-dev.yml.
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8091 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------- profil quality
  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    profiles: [quality]
    restart: unless-stopped
    environment:
      # Base H2 embarquée : usage local (BackReviewer) seulement.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "${SONAR_BIND:-127.0.0.1}:${SONAR_PORT:-9000}:9000"
    networks: [quality]

networks:
  default:
  # Base, Symfony, identity-service et nginx : aucun accès Internet depuis ce réseau.
  backend:
    internal: true
  converter:
    internal: true
  quality:

volumes:
  db_data:
  jwt_keys:
  uploads:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
