name: taskora

# Profils :
#   (aucun)    stack actuelle : database, api (Symfony), converter, web (nginx)
#   identity   + db-init (droits MariaDB) + identity (identity-service Spring Boot)
#   quality    + sonarqube (http://localhost:9000, pour BackReviewer)
# Ports de développement d'identity (8082) : -f docker-compose.identity-dev.yml

services:
  database:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-taskora}
      MARIADB_USER: ${DB_USER:-taskora}
      MARIADB_PASSWORD: ${DB_PASSWORD:-taskora}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-taskora_root}
      # Lu par l'init root (schéma et compte identity), jamais affiché.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_change_me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
      # Volume vide : exécuté automatiquement. Volume existant :
      #   docker compose exec database /docker-entrypoint-initdb.d/10-taskora-init.sh
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3307}:3306"
    networks: [default, backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    # Symfony configuration (S3 storage, secrets…) comes from backend/.env.
    # Optional: without it, the image falls back to backend/.env.dist defaults.
    env_file:
      - path: ./backend/.env
        required: false
    # Docker-specific values, they override backend/.env:
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change_me_in_production_please}
      DATABASE_URL: mysql://${DB_USER:-taskora}:${DB_PASSWORD:-taskora}@database:3306/${DB_NAME:-taskora}?serverVersion=11.8.2-MariaDB&charset=utf8mb4
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-taskora_jwt_passphrase_change_me}
      # Secret partagé de POST /internal/invitations/claim (ADR A10). Vide = endpoint refusé.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      SERVER_NAME: ":80"
    volumes:
      - jwt_keys:/app/config/jwt
      - uploads:/app/public/uploads
    # API_BIND=127.0.0.1 par défaut : /internal/* n'est pas joignable depuis le réseau. Ne l'ouvrir qu'en connaissance de cause.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8081}:80"
    networks: [default, backend, converter]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Office / LibreOffice documents → PDF for the in-page viewer (Gotenberg = LibreOffice over HTTP).
  # Only reachable by the API, on an internal network: no Internet access, no access to the database.
  converter:
    image: gotenberg/gotenberg:8@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=240s", "--libreoffice-restart-after=20", "--log-level=warn"]
    networks: [converter]

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Amont de /api/auth/ et /api/me : api:80 (Symfony) tant que la bascule n'est pas faite,
      # identity:8080 après. Changer la valeur puis « docker compose up -d web » (sans --build).
      IDENTITY_UPSTREAM: ${IDENTITY_UPSTREAM:-api:80}
      # on = gel des écritures d'identité (503 sur POST /api/auth/register et PATCH /api/me).
      IDENTITY_WRITE_FREEZE: ${IDENTITY_WRITE_FREEZE:-off}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    networks: [default, backend]

  # ---------------------------------------------------------------- profil identity
  # Init root idempotente sur un volume existant, après les migrations Symfony
  # (le droit sur taskora.user exige que la table existe).
  db-init:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    profiles: [identity]
    restart: "no"
    user: "999:999"
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["/docker-entrypoint-initdb.d/10-taskora-init.sh"]
    environment:
      DB_HOST: database
      MARIADB_DATABASE: ${DB_NAME:-taskora}
      MARIADB_USER: ${DB_USER:-taskora}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-taskora_root}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_change_me}
    volumes:
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    networks: [backend]

  identity:
    build:
      context: ./services
      dockerfile: identity-service/Dockerfile
    profiles: [identity]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # m10 : JVM à 75 % de mem_limit (JAVA_TOOL_OPTIONS de l'image).
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      database:
        condition: service_healthy
      # Les clés JWT sont créées par l'entrypoint d'api (volume jwt_keys).
      api:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      IDENTITY_DB_URL: jdbc:mariadb://database:3306/identity
      IDENTITY_DB_USER: identity
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_change_me}
      JWT_PRIVATE_KEY_PATH: /run/taskora/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/taskora/jwt/public.pem
      # Même variable que le service api (même paire de clés Lexik).
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-taskora_jwt_passphrase_change_me}
      LEGACY_SCHEMA: ${DB_NAME:-taskora}
      LEGACY_ZONE: Europe/Paris
      SYMFONY_INTERNAL_URL: http://api:80
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    volumes:
      - jwt_keys:/run/taskora/jwt:ro
    # Réseau interne uniquement (pas d'accès Internet, port non publié) : nginx (web) y accède.
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8091 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------- profil quality
  sonarqube:
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    profiles: [quality]
    restart: unless-stopped
    environment:
      # Base H2 embarquée : usage local (BackReviewer) seulement.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "${SONAR_BIND:-127.0.0.1}:${SONAR_PORT:-9000}:9000"
    networks: [quality]

networks:
  default:
  # Base, Symfony, identity-service et nginx : aucun accès Internet depuis ce réseau.
  backend:
    internal: true
  converter:
    internal: true
  quality:

volumes:
  db_data:
  jwt_keys:
  uploads:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
