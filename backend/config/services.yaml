# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Office → PDF conversion service (docker-compose service "converter", Gotenberg)
    env(GOTENBERG_URL): 'http://converter:3000'
    # Browser notifications (Web Push): keys in backend/.env (app:push:keys generates them)
    env(VAPID_PUBLIC_KEY): ''
    env(VAPID_PRIVATE_KEY): ''
    env(VAPID_SUBJECT): 'mailto:admin@example.com'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # concrete storages are built by StorageFactory only
        exclude: '../src/Storage/{S3FileStorage.php,LocalFileStorage.php}'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'

    # File storage: Amazon S3 when STORAGE_DRIVER=s3, local volume otherwise (see .env)
    App\Storage\FileStorage:
        factory: ['App\Storage\StorageFactory', 'create']
        arguments:
            $driver: '%env(STORAGE_DRIVER)%'
            $projectDir: '%kernel.project_dir%'
            $bucket: '%env(AWS_S3_BUCKET)%'
            $region: '%env(AWS_S3_REGION)%'
            $key: '%env(AWS_ACCESS_KEY_ID)%'
            $secret: '%env(AWS_SECRET_ACCESS_KEY)%'
            $endpoint: '%env(AWS_S3_ENDPOINT)%'
            $prefix: '%env(AWS_S3_PREFIX)%'
            $publicUrl: '%env(AWS_S3_PUBLIC_URL)%'

    App\Service\DocumentPreview:
        arguments:
            $gotenbergUrl: '%env(GOTENBERG_URL)%'

    App\Service\PushSender:
        arguments:
            $publicKey: '%env(VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(VAPID_PRIVATE_KEY)%'
            $subject: '%env(VAPID_SUBJECT)%'
