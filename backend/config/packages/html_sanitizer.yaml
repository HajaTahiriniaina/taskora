# Rich text (descriptions, comments) produced by the Tiptap editor.
# Defense in depth: the frontend also sanitizes with DOMPurify before rendering.
framework:
    html_sanitizer:
        sanitizers:
            app.rich_text:
                allow_elements:
                    p: ['style']
                    br: []
                    strong: []
                    b: []
                    em: []
                    i: []
                    u: []
                    s: []
                    code: []
                    pre: []
                    blockquote: []
                    h1: ['style']
                    h2: ['style']
                    h3: ['style']
                    hr: []
                    ul: ['data-type']
                    ol: ['start', 'data-type']
                    li: ['data-type', 'data-checked']
                    label: []
                    input: ['type', 'checked', 'disabled']
                    div: []
                    span: ['style', 'data-type', 'data-id', 'data-label']   # @mentions
                    mark: ['style', 'data-color']
                    a: ['href', 'title', 'target', 'rel']
                    img: ['src', 'alt', 'title', 'width', 'height']
                allowed_link_schemes: ['http', 'https', 'mailto']
                allowed_media_schemes: ['http', 'https']
                # relative /uploads/... URLs for images uploaded to Taskora
                allow_relative_links: true
                allow_relative_medias: true
                force_attributes:
                    a:
                        rel: noopener noreferrer
                        target: _blank
                max_input_length: 200000
