# identity-service (A13) : toute valeur sensible vient d'une variable d'environnement, jamais du dépôt.
spring:
  application:
    name: identity-service
  main:
    banner-mode: "off"
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:mariadb://database:3306/identity}
    username: ${IDENTITY_DB_USER:identity}
    password: ${IDENTITY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Flyway ne gère que le schéma identity, créé par l'init SQL (jamais taskora).
    schemas: identity
    create-schemas: false
    locations: classpath:db/migration

  web:
    # Erreurs : jamais de trace, de message ni d'exception (A4 ; anciennement server.error.*).
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
      whitelabel:
        enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  server:
    # /actuator/health pour le healthcheck Docker, jamais routé par nginx.
    port: 8091
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    # Les messages SQL du pilote citent les valeurs en conflit (e-mail) : jamais journalisés (A13, A18).
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

identity:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    passphrase: ${JWT_PASSPHRASE:}
    ttl: ${JWT_TTL:604800}
  legacy:
    schema: ${LEGACY_SCHEMA:taskora}
    zone: ${LEGACY_ZONE:Europe/Paris}
  symfony:
    internal-url: ${SYMFONY_INTERNAL_URL:http://api:80}
    internal-secret: ${INTERNAL_API_SECRET:}
  invitations:
    # Consommation des invitations (U12, ordre de travail phase 3 §5.2) : URL et secret utilisés ensemble,
    # par défaut ceux de Symfony ; à la bascule de T1, board-service et INTERNAL_SECRET_IDENTITY_TO_BOARD.
    claim-url: ${INVITATION_CLAIM_URL:${identity.symfony.internal-url}}
    claim-secret: ${INVITATION_CLAIM_SECRET:${identity.symfony.internal-secret}}
  password:
    bcrypt-cost: ${IDENTITY_BCRYPT_COST:13}
    # B1 : native (défaut, libxcrypt via FFM, exige --enable-native-access=ALL-UNNAMED) ou java
    # (développement hors Linux). native sans libcrypt.so.1 → refus de démarrer.
    bcrypt-engine: ${IDENTITY_BCRYPT_ENGINE:native}
  outbox:
    relay:
      enabled: ${IDENTITY_OUTBOX_RELAY_ENABLED:true}
