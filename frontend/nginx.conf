server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 105m;
    client_body_timeout 300s;

    # API → Symfony container
    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # large uploads (100 MB) and Office → PDF conversions
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Images uploaded in rich text: the API answers with the file (local storage)
    # or a redirect to a short-lived presigned Amazon S3 URL. Cache headers come from the API.
    location ^~ /uploads/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    }

    # Service worker (browser notifications) and manifest: always revalidated, never cached for long
    location = /push-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets: long cache
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA routing
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
