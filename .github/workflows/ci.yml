# Orchestrateur CI (docs/ci/README.md) : un seul workflow déclenché sur toutes les PR, sans filtre
# de chemins. Le job « changes » reproduit les anciens filtres par `git diff`, les workflows
# réutilisables ne tournent que si leur zone a changé, et « ci-gate » est le seul check requis.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Un seul groupe pour tout le run ; les workflows appelés n'utilisent pas ce nom (pas d'interblocage).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Zones modifiées, avec exactement les filtres de chemins des anciens déclencheurs
  # (plus ci.yml, qui relance tout). PR : diff « trois points » base...tête, comme GitHub.
  # Push sur main : before..sha ; seuls identity-service et frontend tournaient sur push.
  # workflow_dispatch, ou base introuvable : tout est relancé.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      identity_service: ${{ steps.diff.outputs.identity_service }}
      identity_security: ${{ steps.diff.outputs.identity_security }}
      identity_compat: ${{ steps.diff.outputs.identity_compat }}
      board_service: ${{ steps.diff.outputs.board_service }}
      board_security: ${{ steps.diff.outputs.board_security }}
      board_compat: ${{ steps.diff.outputs.board_compat }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Zones modifiées
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          all=false
          files=""
          case "$EVENT" in
            pull_request)
              if ! files="$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")"; then
                echo "::warning::diff $PR_BASE...$PR_HEAD impossible : tout est relancé."
                all=true
              fi
              ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ] \
                || ! files="$(git diff --name-only --no-renames "$PUSH_BEFORE" "$SHA")"; then
                echo "::warning::commit précédent inconnu : tout est relancé."
                all=true
              fi
              ;;
            *)
              all=true
              ;;
          esac
          echo "Fichiers modifiés :"
          printf '%s\n' "$files"

          # match <regex ERE> : true si un fichier modifié correspond (ou si tout est relancé).
          match() {
            if [ "$all" = true ] || printf '%s\n' "$files" | grep -qE "$1|^\.github/workflows/ci\.yml$"; then
              echo true
            else
              echo false
            fi
          }
          backend="$(match '^(backend/|docker-compose\.yml$|docker/mariadb/|docs/contracts/openapi/symfony\.internal\.yaml$|\.github/workflows/backend\.yml$)')"
          identity_service="$(match '^(services/|\.github/workflows/identity-service\.yml$)')"
          identity_security="$(match '^(services/(.*/)?pom\.xml$|\.github/workflows/identity-security\.yml$)')"
          identity_compat="$(match '^(services/identity-service/|backend/|docker-compose\.yml$|docker-compose\.identity-dev\.yml$|docker/mariadb/|frontend/nginx\.conf$|frontend/Dockerfile$|\.github/workflows/identity-compat\.yml$)')"
          # board-service (phase 3, demande §B1) ; board_service inclut backend/migrations/ et
          # docker/mariadb/ (schéma taskora des IT et script d'init, §B6).
          board_service="$(match '^(services/board-service/|services/pom\.xml$|services/config/|services/\.mvn/|services/mvnw|backend/migrations/|docker/mariadb/|\.github/workflows/board-service\.yml$)')"
          board_security="$(match '^(services/board-service/pom\.xml$|services/pom\.xml$|\.github/workflows/board-security\.yml$)')"
          board_compat="$(match '^(services/board-service/|services/identity-service/|backend/|docker-compose[^/]*\.yml$|docker/mariadb/|frontend/nginx\.conf$|frontend/Dockerfile$|\.github/workflows/board-compat\.yml$)')"
          frontend="$(match '^(frontend/|services/identity-service/|services/board-service/|services/pom\.xml$|backend/|docker-compose[^/]*\.yml$|docker/mariadb/|\.github/workflows/frontend\.yml$)')"

          # Sur push, backend, identity-security et identity-compat ne tournaient pas : inchangé.
          # board-security et board-compat : PR seulement aussi (§B1).
          if [ "$EVENT" = push ]; then
            backend=false
            identity_security=false
            identity_compat=false
            board_security=false
            board_compat=false
          fi

          {
            echo "backend=$backend"
            echo "identity_service=$identity_service"
            echo "identity_security=$identity_security"
            echo "identity_compat=$identity_compat"
            echo "board_service=$board_service"
            echo "board_security=$board_security"
            echo "board_compat=$board_compat"
            echo "frontend=$frontend"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/backend.yml

  identity-service:
    needs: changes
    if: needs.changes.outputs.identity_service == 'true'
    permissions:
      contents: read
      actions: read # identity-test-report
      checks: write # identity-test-report (seul job appelé qui l'utilise)
    uses: ./.github/workflows/identity-service.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  identity-security:
    needs: changes
    if: needs.changes.outputs.identity_security == 'true'
    permissions:
      contents: read
      actions: read # upload-sarif
      security-events: write # upload-sarif
    uses: ./.github/workflows/identity-security.yml
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  identity-compat:
    needs: changes
    if: needs.changes.outputs.identity_compat == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/identity-compat.yml

  board-service:
    needs: changes
    if: needs.changes.outputs.board_service == 'true'
    permissions:
      contents: read
      actions: read # board-test-report
      checks: write # board-test-report (seul job appelé qui l'utilise)
    uses: ./.github/workflows/board-service.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  board-security:
    needs: changes
    if: needs.changes.outputs.board_security == 'true'
    permissions:
      contents: read
      actions: read # upload-sarif
      security-events: write # upload-sarif
    uses: ./.github/workflows/board-security.yml
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  board-compat:
    needs: changes
    if: needs.changes.outputs.board_compat == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/board-compat.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      actions: read # frontend-test-report
      checks: write # frontend-test-report (seul job appelé qui l'utilise)
    uses: ./.github/workflows/frontend.yml

  # Seul check requis par la protection de branche. Toujours exécuté (même après un échec ou une
  # annulation) : échec si un job requis a échoué ou a été annulé ; « ignoré » = zone non concernée.
  ci-gate:
    name: ci-gate
    needs: [changes, backend, identity-service, identity-security, identity-compat, board-service, board-security, board-compat, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Résultats des jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::Jobs en échec ou annulés : $bad"
            exit 1
          fi
          echo "Tous les jobs concernés ont réussi."
