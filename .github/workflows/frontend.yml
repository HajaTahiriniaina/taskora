# Frontend Angular : qualité, unitaires, build, image et e2e d'identité sur les deux amonts
# (docs/ci/requests/frontend.md, réponse de Manuel au §8).
name: frontend

# PR et push sur main : appelé par ci.yml (ancien filtre : frontend/**, services/identity-service/**,
# services/pom.xml, backend/**, docker-compose*.yml, docker/mariadb/**, ce fichier). Manuel : autonome.
on:
  workflow_call:
    inputs:
      upstream:
        description: "Amont(s) d'identité pour frontend-e2e-identity (both, symfony, identity)"
        type: string
        default: both
  workflow_dispatch:
    inputs:
      upstream:
        description: "Amont(s) d'identité pour frontend-e2e-identity"
        type: choice
        default: both
        options: [both, symfony, identity]

permissions: {}

# Nom fixe : appelé, github.workflow vaudrait « ci » et le groupe de l'appelant (interblocage évité).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-quality:
    name: frontend-quality (lint, prettier, tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Ligne de base ESLint de C0 (docs/reviews/2026-11-26-frontend-identity.md : 0 erreur,
      # 904 avertissements). Ne jamais l'augmenter ; la baisser quand des avertissements disparaissent.
      LINT_MAX_WARNINGS: "904"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Échec si au moins une erreur, ou plus d'avertissements que la ligne de base.
      - name: Lint (ng lint, 0 erreur, avertissements ≤ ligne de base)
        run: |
          mkdir -p reports
          npx ng lint --max-warnings="$LINT_MAX_WARNINGS" --format=json --output-file=reports/eslint.json
      - name: Résumé lint
        if: always()
        run: |
          [ -f reports/eslint.json ] || exit 0
          # shellcheck disable=SC2016 # script JavaScript : les ${…} sont des gabarits JS, pas du shell
          node -e '
            const path = require("node:path");
            const results = require(path.resolve("reports/eslint.json"));
            const max = Number(process.env.LINT_MAX_WARNINGS);
            let errors = 0, warnings = 0;
            for (const file of results) {
              errors += file.errorCount;
              warnings += file.warningCount;
              const rel = path.relative(process.env.GITHUB_WORKSPACE, file.filePath);
              for (const m of file.messages) {
                if (m.severity === 2) console.log(`::error file=${rel},line=${m.line ?? 1}::${m.ruleId ?? "eslint"}: ${m.message}`);
              }
            }
            console.log(`ESLint : ${errors} erreur(s), ${warnings} avertissement(s) (ligne de base : ${max}).`);
            if (warnings > max) console.log(`::error::Avertissements ESLint au-dessus de la ligne de base (${warnings} > ${max}).`);
            if (warnings < max) console.log(`::notice::Avertissements sous la ligne de base (${warnings} < ${max}) : abaisser LINT_MAX_WARNINGS.`);
          '
      - name: Format (Prettier)
        run: npx prettier --check .
      - name: Types (application, unitaires, e2e)
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.spec.json --noEmit
          npx tsc -p e2e/tsconfig.json --noEmit
      - name: Rapport ESLint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-lint-report
          retention-days: 14
          if-no-files-found: ignore
          path: frontend/reports/eslint.json

  frontend-unit:
    name: frontend-unit (ng test, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # JUnit : reports/unit-junit.xml ; couverture : reports/coverage/ (lcov, cobertura), sans seuil en phase 2.
      - name: Tests unitaires et composants
        run: npx ng test --watch=false --coverage
      - name: Rapports JUnit et couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-unit-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            frontend/reports/unit-junit.xml
            frontend/reports/coverage/

  frontend-build:
    name: frontend-build (ng build production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build production
        run: npx ng build --configuration production

  frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build seulement : aucune publication de registre sans accord de l'utilisateur.
      - name: docker build
        working-directory: .
        run: docker build -f frontend/Dockerfile -t taskora/web:ci frontend/

  # Stack compose complète (profil identity) ; seul IDENTITY_UPSTREAM change entre les branches.
  frontend-e2e-identity:
    name: frontend-e2e-identity (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch : entrée upstream (both par défaut) ; autres événements : les deux amonts.
        include: ${{ fromJSON(inputs.upstream == 'symfony' && '[{"backend":"symfony","upstream":"api:80"}]' || inputs.upstream == 'identity' && '[{"backend":"identity","upstream":"identity:8080"}]' || '[{"backend":"symfony","upstream":"api:80"},{"backend":"identity","upstream":"identity:8080"}]') }}
    env:
      # Projet compose dédié à la CI : down -v ne vise que lui.
      COMPOSE: docker compose -p taskora-ci -f docker-compose.yml --profile identity
      IDENTITY_UPSTREAM: ${{ matrix.upstream }}
      IDENTITY_WRITE_FREEZE: "off"
      WEB_BIND: "127.0.0.1"
      WEB_PORT: "8080"
      SECRET_NAMES: JWT_PASSPHRASE INTERNAL_API_SECRET IDENTITY_DB_PASSWORD DB_PASSWORD DB_ROOT_PASSWORD APP_SECRET
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund

      # Navigateurs de la version exacte de @playwright/test du lockfile (1.65.1).
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Installer Chromium et ses dépendances
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dépendances système de Chromium (cache présent)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Secrets de CI éphémères, masqués ; aucun .env n'est créé ni lu.
      - name: Secrets éphémères
        working-directory: .
        run: |
          for name in $SECRET_NAMES; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Démarrer la stack (database, api, db-init, identity, web)
        working-directory: .
        run: $COMPOSE up -d --build

      - name: Attendre identity et web
        working-directory: .
        run: |
          deadline=$((SECONDS + 600))
          until [ "$(docker inspect -f '{{.State.Health.Status}}' "$($COMPOSE ps -q identity)" 2>/dev/null)" = healthy ] \
            && curl -fsS -o /dev/null "http://$WEB_BIND:$WEB_PORT/" \
            && curl -fsS -o /dev/null "http://$WEB_BIND:$WEB_PORT/api/health"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              $COMPOSE ps
              echo "::error::identity ou web n'est pas prêt après 10 min"
              exit 1
            fi
            sleep 5
          done
          $COMPOSE ps

      # Sans ce contrôle, la branche identity pourrait tester Symfony sans le dire.
      # Environnement de web (sans secret) et gabarit nginx rendu ; rien n'est affiché.
      - name: Contrôler l'amont effectif de web
        working-directory: .
        run: |
          web="$($COMPOSE ps -q web)"
          if ! docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$web" | grep -qx "IDENTITY_UPSTREAM=${IDENTITY_UPSTREAM}"; then
            echo "::error::web ne tourne pas avec IDENTITY_UPSTREAM=${IDENTITY_UPSTREAM}"
            exit 1
          fi
          if ! $COMPOSE exec -T web grep -qF "\"http://${IDENTITY_UPSTREAM}\"" /etc/nginx/conf.d/default.conf; then
            echo "::error::la configuration nginx rendue ne pointe pas vers ${IDENTITY_UPSTREAM}"
            exit 1
          fi
          echo "Amont d'identité effectif : ${IDENTITY_UPSTREAM}"

      - name: Tests e2e @identity (Playwright, Chromium)
        env:
          E2E_BASE_URL: http://${{ env.WEB_BIND }}:${{ env.WEB_PORT }}
          E2E_BACKEND: ${{ matrix.backend }}
          CI: "true"
        run: npx playwright test --grep @identity --project=chromium

      # Contrôle de fuite AVANT toute publication : valeurs éphémères ou jeton eyJ….eyJ… → rien n'est publié.
      - name: Contrôle de fuite des rapports
        id: scan-reports
        if: always()
        run: |
          [ -d reports ] || { echo "clean=true" >> "$GITHUB_OUTPUT"; exit 0; }
          leak=0
          for name in $SECRET_NAMES; do
            if [ -n "${!name:-}" ] && grep -rqaF -- "${!name}" reports; then leak=1; fi
          done
          if grep -rqaE 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+' reports; then leak=1; fi
          if [ "$leak" = 1 ]; then
            rm -rf reports
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "::error::Les rapports e2e contiennent un secret ou un jeton : non publiés."
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
      - name: Rapports e2e
        if: always() && steps.scan-reports.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-identity-${{ matrix.backend }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            frontend/reports/e2e-junit.xml
            frontend/reports/e2e-html/
            frontend/reports/e2e-artifacts/

      - name: Journaux compose (échec)
        id: scan-logs
        if: failure()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/compose-logs"
          log="$RUNNER_TEMP/compose-logs/compose.log"
          $COMPOSE logs --no-color > "$log" 2>&1 || true
          leak=0
          for name in $SECRET_NAMES; do
            if [ -n "${!name:-}" ] && grep -qaF -- "${!name}" "$log"; then leak=1; fi
          done
          if grep -qaE 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+' "$log"; then leak=1; fi
          if [ "$leak" = 1 ]; then
            rm -f "$log"
            echo "::error::Les journaux compose contiennent un secret ou un jeton : non publiés."
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
      - name: Publier les journaux compose
        if: failure() && steps.scan-logs.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-compose-logs-${{ matrix.backend }}
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/compose-logs/

      # Toujours, même en cas d'échec ou d'annulation : les comptes e2e disparaissent avec les volumes.
      - name: Arrêter la stack (projet taskora-ci)
        if: always()
        working-directory: .
        run: $COMPOSE down -v --remove-orphans

  # Publication des JUnit dans l'onglet Checks : seul job avec checks: write,
  # ignoré pour les PR venant d'un fork (jeton en lecture seule).
  frontend-test-report:
    needs: [frontend-unit, frontend-e2e-identity]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    defaults:
      run:
        working-directory: .
    steps:
      # dorny/test-reporter liste les fichiers du dépôt (git ls-files) pour relier les résultats aux sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: frontend-unit-reports
          path: test-reports/unit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: frontend-e2e-identity-*
          path: test-reports/e2e
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: frontend unit tests
          path: "test-reports/unit/**/unit-junit.xml"
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: frontend e2e identity
          path: "test-reports/e2e/**/e2e-junit.xml"
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
